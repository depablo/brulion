    /*
    Function: selectRecipients

    Function retrieves recipients by type from the backend.

    Parameters:
         string recipeintType
         boolean isVirtualClasses
         boolean group
         ?int classId

    */
        function selectRecipients(recipeintType, isVirtualClasses, group, classId)
        {
            if (isVirtualClasses == undefined) {
                isVirtualClasses == false;
            }

            if (group == undefined) {
                group == 0;
            }

            if (classId == undefined) {
                classId == null;
            }

            $(".isVirtualSelect").prop("disabled", true);

            if ($("#radio_uczen_klasami").prop("checked")) {
                $("#uczen_klasami_radio").prop("disabled", false);
            } else if ($("#radio_rodzic_klasami").prop("checked")) {
                $("#rodzic_klasami_radio").prop("disabled", false);
            }

            if (($("#radio_sadmin").is(":checked"))) {
                $("#checkHelp").show();
            } else {
                $("#checkHelp").hide();
            }

            setVisibleMessageTypeField();
            $.ajax({
                url: '/getRecipients',
                data: {
                    typAdresata: recipeintType,
                    poprzednia: 5,
                    tabZaznaczonych: '',
                    czyWirtualneKlasy: isVirtualClasses,
                    idGrupy : group,
                    klasa_rada_rodzicow : classId,
                    klasa_opiekunowie : classId,
                    klasa_rodzice : classId
                },
                cache: false,
                type: "POST",
                success: function(html){
                    $("#adresaci").html(html);
                    $("#sendButton").button("enable");
                }
            });
        };

        /*
        Function: setVisibleMessageTypeField

        Method of handling visibility selecta "advise".
        */
        const setVisibleMessageTypeField = function()
        {
            const typeMessage = 0;
            const typeNote = 1;
            if (
                $("#radio_rodzic_klasami").prop("checked")
                || $("#radio_rodzic").prop("checked")
                || $("#radio_opiekun").prop("checked")
                || $("#radio_rodzic_klasami").prop("checked")
                || $("#radio_opiekunowie_klasami").prop("checked")
            ) {
                $("#messageTypeRow").show();
            } else {
                $("#messageTypeRow").hide();
                $("#listOfMessageTypes").val(typeMessage);
            }
        }

        function requestSearchLoop() {

            if (!inProgress && (query.length > 2) && (query != latestServerQuery)) {

                }

                $.post("\/wiadomosci\/2\/5", {"checkHelp":query}, function(data) {
                    $('#checkHelp').html(data);
                    inProgress = false;
                });
                latestServerQuery = query;
            }
        }
